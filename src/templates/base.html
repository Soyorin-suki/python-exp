<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}房价预测系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">🏠</span>
                <div>
                    <div class="brand-title">房价预测系统</div>
                    <div class="brand-subtitle">数据上传 · 清洗 · 训练 · 预测 · 可视化</div>
                </div>
            </div>
            <nav class="topnav">
                <a href="/">首页</a>
                <a href="/upload">上传</a>
                <a href="/clean">清洗</a>
                <a href="/train">训练</a>
                <a href="/predict">预测</a>
                <a href="/predict-test">测试</a>
                <a href="/visualize">可视化</a>
            </nav>
        </header>

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
